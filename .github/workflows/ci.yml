name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f q27/requirements.txt ]; then pip install -r q27/requirements.txt; fi
          if [ -f q26/requirements.txt ]; then pip install -r q26/requirements.txt; fi

      - name: Security Check — Detect Committed Credentials
        run: |
          echo "Scanning codebase for hardcoded keys..."
          if git grep -E -i "(sk-[a-zA-Z0-9]{20,}|api[_-]?key\s*=\s*['\"][a-zA-Z0-9_-]{16,}['\"])" -- ':!*.md' ':!.github/*'; then
            echo "::error::Hardcoded API secret found in codebase! Aborting."
            exit 1
          else
            echo "No hardcoded credentials detected."
          fi

      - name: Run Pytest Suite (Q27)
        env:
          PYTHONPATH: q27
          LLM_API_KEY: ""
        run: |
          pytest q27/test_gateway.py -v

      - name: Start Gateway & Run Mock Client
        run: |
          cd q27
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          
          echo "Waiting for gateway..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/healthz | grep -q "ok"; then
              echo "Gateway ready."
              break
            fi
            sleep 1
          done

          python mock_client.py
          kill $SERVER_PID
